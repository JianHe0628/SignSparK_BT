[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signspark-bt"
dynamic = ["version"]
description = "Sign language back-translation: SMPL+MANO pose features to spoken language text"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["sign language", "back-translation", "SLP evaluation", "SMPL-X"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=1.13",
    "numpy>=1.21",
    "lmdb>=1.3",
    "PyYAML>=5.4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Chinese word segmentation, needed only for CSL-Daily.
zh = ["jieba>=0.42"]
# Experiment logging.
logging = ["wandb>=0.15"]
# Generating pseudo-glosses for How2Sign.
pseudogloss = ["spacy>=3.4"]
dev = ["pytest>=7.0"]

[project.scripts]
signspark-bt = "signspark_bt.cli:main"

[tool.setuptools]
packages = [
    "signspark_bt",
    "signspark_bt.data",
    "signspark_bt.model",
    "signspark_bt.training",
    "signspark_bt.external_metrics",
]

[tool.setuptools.dynamic]
version = { attr = "signspark_bt.version.__version__" }
