# Back-translation on How2Sign (American Sign Language).
#
# How2Sign ships without glosses, so the CTC recognition head is trained on
# pseudo-glosses derived from the translation. Generate them first:
#   python -m spacy download en_core_web_lg
#   python tools/make_pseudo_glosses.py --dataset How2Sign
# To train without the recognition head instead, set
# training.recognition_loss_weight to 0.0 and drop pseudo_gloss_dir.
name: bt_how2sign

# Weights & Biases logging. Set WANDB_API_KEY and WANDB_ENTITY in the
# environment; no credentials belong in this file.
wandb: true
wandb_project: back_translation

data:
    # LMDBs live in ${DATA_ROOT}/lmdb/{train,dev,test}. Download them with
    # tools/download_data.py from the SignSparK repo.
    base_path: "${DATA_ROOT}/lmdb"
    dataset: How2Sign           # matched against the LMDB filename
    version: how2sign
    pseudo_gloss_dir: "${DATA_ROOT}/pseudo_glosses"
    feature_size: 240           # SMPL+MANO: body 60 + left hand 90 + right hand 90
    level: word
    tokenizer: whitespace
    txt_lowercase: true
    max_sent_length: 400        # filters the training split only
    max_sgn_length: 300         # frames per clip, longer clips are truncated
    random_train_subset: -1
    random_dev_subset: -1

testing:
    recognition_beam_sizes:
    - 1
    translation_beam_sizes:
    - 1
    - 2
    - 3
    - 4
    - 5
    translation_beam_alphas:
    - -1
    - 0
    - 1
    - 2
    - 3

training:
    model_dir: "./checkpoints/bt_how2sign"
    random_seed: 42
    reset_best_ckpt: false
    reset_scheduler: false
    reset_optimizer: false
    recognition_loss_weight: 1.0
    translation_loss_weight: 1.0
    eval_metric: bleu
    optimizer: adam
    learning_rate: 0.0005
    batch_size: 128
    batch_type: sentence
    num_workers: 4
    epochs: 250
    early_stopping_metric: eval_metric
    translation_normalization: batch
    eval_recognition_beam_size: 1
    eval_translation_beam_size: 3
    eval_translation_beam_alpha: -1
    num_valid_log: 5
    overwrite: false
    shuffle: true
    use_cuda: true
    translation_max_output_length: 30
    keep_last_ckpts: 3
    batch_multiplier: 1
    logging_freq: 100
    validation_freq: 100
    betas:
    - 0.9
    - 0.998
    scheduling: plateau
    learning_rate_min: 1.0e-08
    weight_decay: 0.001
    patience: 3
    decrease_factor: 0.8
    label_smoothing: 0.1

model:
    initializer: xavier
    bias_initializer: zeros
    init_gain: 1.0
    embed_initializer: xavier
    embed_init_gain: 1.0
    tied_softmax: false
    encoder:
        type: transformer
        num_layers: 3
        num_heads: 8
        embeddings:
            embedding_dim: 512
            scale: false
            dropout: 0.1
            norm_type: batch
            activation_type: softsign
        hidden_size: 512
        ff_size: 1024
        dropout: 0.1
    decoder:
        type: transformer
        num_layers: 3
        num_heads: 8
        embeddings:
            embedding_dim: 512
            scale: false
            dropout: 0.1
            norm_type: batch
            activation_type: softsign
        hidden_size: 512
        ff_size: 1024
        dropout: 0.1
